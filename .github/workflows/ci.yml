name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + notebook validation (no Spark, no Fabric credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Fabric Runtime 1.3 uses Python 3.11
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - name: Generated notebooks are up to date and valid
        run: |
          python scripts/build_notebooks.py --check
          python scripts/verify_notebooks.py
      - run: pytest -m "not spark"

  spark:
    name: Spark + Delta tests (local, no Fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark]"
      - run: pytest -m spark
        timeout-minutes: 30
